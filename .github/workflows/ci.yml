name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://app_user:app_password@127.0.0.1:5432/contexual_test
  JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  WEB_URL: http://127.0.0.1:3000
  FILE_SCANNING_REQUIRED: 'true'
  CLAMAV_HOST: 127.0.0.1
  CLAMAV_PORT: '3310'

jobs:
  quality:
    name: Lint, unit tests, and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test --workspace @repo/api -- --runInBand
      - run: npm test --workspace @repo/web
      - run: npm run build

  integration:
    name: PostgreSQL, RLS, and ClamAV e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contexual_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contexual_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      clamav:
        image: clamav/clamav:1.4.3
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --ping=1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Create non-superuser application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d contexual_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user LOGIN PASSWORD 'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CONNECT ON DATABASE contexual_test TO app_user;
          GRANT USAGE, CREATE ON SCHEMA public TO app_user;
          SQL
      - name: Deploy and verify migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contexual_test
        run: |
          npm run db:generate
          npm run db:deploy
          npx prisma migrate status --config packages/database/prisma.config.ts
      - name: Grant migrated objects to application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d contexual_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO app_user;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO app_user;
          SQL
      - name: Run API e2e as non-superuser
        env:
          NODE_ENV: test
          LOCAL_UPLOAD_DIR: .uploads-ci
        run: npm run test:e2e --workspace @repo/api -- --runInBand

  docker:
    name: Docker configuration and build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supply compose environment files
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env
      - run: docker compose config --quiet
      - run: docker build --target api -t contexual-api:ci .
      - run: docker build --target web -t contexual-web:ci .

  browser-smoke:
    name: Conditional Playwright smoke
    if: vars.RUN_PLAYWRIGHT == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contexual_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contexual_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      clamav:
        image: clamav/clamav:1.4.3
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --ping=1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contexual_test
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d contexual_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user LOGIN PASSWORD 'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CONNECT ON DATABASE contexual_test TO app_user;
          GRANT USAGE, CREATE ON SCHEMA public TO app_user;
          SQL
          npm run db:deploy
          psql -h 127.0.0.1 -U postgres -d contexual_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO app_user;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO app_user;
          SQL
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start application and worker
        env:
          NODE_ENV: test
          INTERNAL_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_API_URL: ''
          LOCAL_UPLOAD_DIR: .uploads-playwright
        run: |
          npm run start --workspace @repo/api > api.log 2>&1 &
          npm run worker:prod --workspace @repo/api > worker.log 2>&1 &
          npm run start --workspace @repo/web > web.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat api.log web.log
          exit 1
      - run: npm run test:e2e --workspace @repo/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:3001/api
      - name: Upload browser service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-service-logs
          path: |
            api.log
            worker.log
            web.log
